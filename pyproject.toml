[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cedr"
version = "0.2.0"
description = "Continuous Embedding Diffusion Reasoner"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.6,<2.12", "transformers==4.57.6", "huggingface-hub>=0.34,<2",
  "safetensors>=0.4", "einops>=0.8", "numpy>=1.24", "PyYAML>=6", "muon-optimizer==0.1.0"]

[project.optional-dependencies]
data = ["datasets>=3,<5"]
math = ["math-verify==0.9.0", "latex2sympy2-extended==1.11.0", "antlr4-python3-runtime==4.13.2", "pylatexenc==2.11", "sympy==1.14.0", "mpmath==1.3.0"]
code = ["evalplus @ git+https://github.com/evalplus/evalplus.git@26d6d00bb1fd0fa37f39c99d5290da67891d1c5e"]
test = ["pytest>=8", "build"]

[project.scripts]
cedr = "cedr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
cedr = ["benchmark_specs.json"]
